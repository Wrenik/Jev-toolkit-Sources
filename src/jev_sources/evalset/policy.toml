# Policy used by the evaluation and the demo. Invented sites (".test" never resolves on the real web).
[policy]
name = "eval-law"
version = "1.2.0"
jurisdictions = ["SE"]

[[changelog]]
version = "1.2.0"
date = "2026-11-03"
note = "Added the HR handbook document set."

[[changelog]]
version = "1.1.0"
date = "2026-10-20"
note = "Swedish government law pages only under /lagstiftning."

[[allow]]
id = "law-se"
host = "lagen.test"
subdomains = true
jurisdiction = "SE"

[[allow]]
id = "gov-se"
prefix = "https://gov.test/lagstiftning"
jurisdiction = "SE"

[[allow]]
id = "news"
host = "nyheter.test"

[[allow]]
id = "de-law"
host = "gesetze.test"
jurisdiction = "DE"

[[allow]]
id = "hr-docs"
docset = "hr"

[[deny]]
id = "no-blog"
host = "blog.lagen.test"

[[deny]]
id = "no-forum"
prefix = "https://nyheter.test/debatt"

[[docset]]
id = "hr"
root = "docs"
